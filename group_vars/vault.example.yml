---
# Copy this file to a vault file and replace the placeholders with
# ansible-vault encrypted values.
raspberrypi_root_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  replace-with-ansible-vault-encrypted-data

raspberrypi_user_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  replace-with-ansible-vault-encrypted-data

# Reference these values from ssh_client_private_keys in host_vars.
vault_ssh_client_private_keys:
  example_key: !vault |
    $ANSIBLE_VAULT;1.1;AES256
    replace-with-ansible-vault-encrypted-private-key

# The value must be a SHA-512 crypt password hash, encrypted with ansible-vault.
vault_sf8008_root_password_hash: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  replace-with-ansible-vault-encrypted-password-hash
