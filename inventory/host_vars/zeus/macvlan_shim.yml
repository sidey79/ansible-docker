---
# Shim for the matterjs-server container (macvlan homelan, 10.2.11.23 / fd00:10:2:11::23).
# fhempy-matter runs in the bridge network of FHEM and connects to it through
# this shim. 10.2.11.20 is reserved as zeus-shim in docker-network/docker-compose.yaml.
macvlan_shim_name: macvlan-shim
macvlan_shim_parent: eno1
macvlan_shim_ipv4: 10.2.11.20/32
macvlan_shim_ipv4_route: 10.2.11.23/32
macvlan_shim_ipv6: fd00:10:2:11::20/128
macvlan_shim_ipv6_route: fd00:10:2:11::23/128
