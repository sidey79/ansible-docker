---
- name: Require reviewed Docker daemon configuration
  ansible.builtin.assert:
    that:
      - docker_daemon_config_import_reviewed | default(false) | bool
    fail_msg: >-
      The Docker daemon configuration has not been reviewed. Run
      playbooks/import_mdns_services.yml and review
      inventory/host_vars/zeus/docker_daemon.yml before applying it.

- name: Ensure Docker configuration directory exists
  ansible.builtin.file:
    path: "{{ docker_daemon_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install reviewed Docker daemon configuration
  ansible.builtin.copy:
    src: "{{ docker_daemon_config_asset }}"
    dest: "{{ docker_daemon_config_path }}"
    owner: "{{ docker_daemon_config_owner }}"
    group: "{{ docker_daemon_config_group }}"
    mode: "{{ docker_daemon_config_mode }}"
  notify: Restart Docker daemon
