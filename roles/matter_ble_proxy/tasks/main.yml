---
- name: Validate matter-ble-proxy settings
  ansible.builtin.assert:
    that:
      - matter_ble_proxy_server_url is match('^wss?://')
      - matter_ble_proxy_user is match('^[a-z_][a-z0-9_-]*$')
      - matter_ble_proxy_install_dir is match('^/')
      - matter_ble_proxy_package_state in ['present', 'latest']
      - matter_ble_proxy_adapter | length == 0 or matter_ble_proxy_adapter is match('^[A-Za-z0-9:_-]+$')
      - matter_ble_proxy_adapter | length == 0 or matter_ble_proxy_adapter_flag_supported | bool
    fail_msg: >-
      Invalid matter-ble-proxy settings. The server URL must start with ws:// or
      wss://. matter_ble_proxy_adapter must stay empty because the upstream CLI
      has no adapter option; set matter_ble_proxy_adapter_flag_supported to true
      only for a version that has one.

- name: Require Python 3.12 or newer for matter-ble-proxy
  ansible.builtin.assert:
    that: ansible_facts['python_version'] is version('3.12', '>=')
    fail_msg: >-
      matter-ble-proxy needs Python >= 3.12 but this host has
      {{ ansible_facts['python_version'] }} (Bookworm). Install a newer
      interpreter and set matter_ble_proxy_python to it.
  when: matter_ble_proxy_python == 'python3'

- name: Install system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - bluez
      - dbus
      # Lets Ansible become the unprivileged service user.
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start the Bluetooth service
  ansible.builtin.systemd:
    name: bluetooth
    enabled: true
    state: started

- name: Create the service user
  ansible.builtin.user:
    name: "{{ matter_ble_proxy_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ matter_ble_proxy_install_dir }}"
    create_home: false
    groups: "{{ matter_ble_proxy_group }}"
    append: true

- name: Create the installation directory
  ansible.builtin.file:
    path: "{{ matter_ble_proxy_install_dir }}"
    state: directory
    owner: "{{ matter_ble_proxy_user }}"
    group: "{{ matter_ble_proxy_group }}"
    mode: "0750"

- name: Install matter-ble-proxy into the virtual environment
  ansible.builtin.pip:
    name: matter-ble-proxy
    state: "{{ matter_ble_proxy_package_state }}"
    virtualenv: "{{ matter_ble_proxy_install_dir }}/venv"
    virtualenv_command: "{{ matter_ble_proxy_python }} -m venv"
  become: true
  become_user: "{{ matter_ble_proxy_user }}"
  notify: Restart matter-ble-proxy

- name: Install the systemd unit
  ansible.builtin.template:
    src: matter-ble-proxy.service.j2
    dest: /etc/systemd/system/matter-ble-proxy.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart matter-ble-proxy

- name: Apply pending handlers before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start matter-ble-proxy
  ansible.builtin.systemd:
    name: matter-ble-proxy
    enabled: true
    state: started

