---
# Generated by playbooks/import_mdns_services.yml from zeus, then reconciled by
# hand against the live host (systemctl list-units 'avahi-alias*').
mdns_services_import_reviewed: true
# Kept disabled unless XML service files are explicitly in scope.
mdns_services_authoritative: false
mdns_services: []

# Template unit files. Their prefix names the host whose IPv4 address the alias
# resolves to via %j: zeus.local for avahi-alias-zeus@, Caddy.local (the
# reverse proxy) for avahi-alias-Caddy@. Both files are byte-identical.
avahi_alias_units:
  - name: avahi-alias-zeus@.service
    owner: root
    group: root
    mode: '0644'
    sha256: 6fb43f7e929c9d6877b607085e9da4f08cb3314998f2c128a03194f82975969d
  - name: avahi-alias-Caddy@.service
    owner: root
    group: root
    mode: '0644'
    sha256: 6fb43f7e929c9d6877b607085e9da4f08cb3314998f2c128a03194f82975969d

# The instance name is the .local name actually announced on the network.
avahi_alias_instances:
  - name: avahi-alias-Caddy@bitwarden.local.service
    enabled: true
    state: started
  - name: avahi-alias-Caddy@n8n.local.service
    enabled: true
    state: started
  - name: avahi-alias-zeus@duplicati.local.service
    enabled: true
    state: started

mdns_services_import_report:
  imported_at_utc: "2026-08-09T18:52:27Z"
  avahi_daemon_package:
    - arch: amd64
      category: net
      name: avahi-daemon
      origin: Ubuntu
      source: apt
      version: 0.8-13ubuntu6.2

  avahi_daemon_service:
    name: avahi-daemon.service
    source: systemd
    state: running
    status: enabled
