---
- name: Configure authorized SSH keys
  hosts: ssh_key_targets
  gather_facts: false
  vars:
    ssh_authorized_key_files:
      - "{{ inventory_dir }}/../keys/s26.pub"
      - "{{ inventory_dir }}/../keys/bienchen.pub"
      - "{{ inventory_dir }}/../keys/ansible_ed25519.pub"
  roles:
    - ssh_authorized_keys

  tasks:
    - name: Set the sf8008 root password
      when: inventory_hostname == 'sf8008'
      ansible.builtin.user:
        name: root
        password: "{{ sf8008_root_password_hash }}"
        update_password: always
      no_log: true
